name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organizar arquivos
        run: |
          mkdir -p www/icons assets
          cp index.html manifest.webmanifest sw.js exceljs.min.js www/
          cp icon-*.png maskable-*.png apple-touch-icon.png favicon-32.png www/icons/
          cp logo.png assets/logo.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones e tela de abertura
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0b1f3a" --iconBackgroundColorDark "#0b1f3a" --splashBackgroundColor "#0b1f3a" --splashBackgroundColorDark "#0b1f3a"

      - name: Sincronizar app
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../DiarioDeBordo.apk

      - name: Publicar APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Diário de Bordo v1.0.${{ github.run_number }}
          body: |
            Baixe o arquivo **DiarioDeBordo.apk** abaixo pelo celular Android e toque nele para instalar.
            (Se pedir, permita instalar apps desta fonte.)
          files: DiarioDeBordo.apk
          make_latest: true

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organizar arquivos
        run: |
          mkdir -p www/icons assets
          cp index.html manifest.webmanifest sw.js exceljs.min.js www/
          cp icon-*.png maskable-*.png apple-touch-icon.png favicon-32.png www/icons/
          cp logo.png assets/logo.png

      - name: Publicar versão web (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
